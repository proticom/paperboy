name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root, all workspaces)
        run: npm ci

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Check committed extension bundle is up to date
        run: |
          if ! git diff --exit-code paperboy-ext/sidepanel.bundle.js; then
            echo "::error file=paperboy-ext/sidepanel.bundle.js::sidepanel.bundle.js is stale; run npm run build and commit it"
            exit 1
          fi

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test workspaces
        run: npm test --workspaces --if-present
