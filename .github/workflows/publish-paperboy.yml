name: Publish @proticom/paperboy

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          # DO NOT set registry-url — it writes .npmrc with empty token (404s OIDC)

      - name: Install dependencies (root, all workspaces)
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build --workspace=@proticom/paperboy-converter
          npm run build --workspace=@proticom/paperboy-ai

      - name: Build
        working-directory: paperboy-cli
        run: npm run build

      - name: Run tests
        working-directory: ./paperboy-cli
        run: npm test

      - name: Publish to npm (OIDC trusted publishing, no token needed)
        working-directory: paperboy-cli
        run: |
          node ../scripts/pin-registry-deps.mjs cli
          npm publish --access public
