# Publishes @proticom/paperboy-ai — OIDC trusted publishing (no NPM_TOKEN, no registry-url).
# https://docs.npmjs.com/trusted-publishers
name: Publish paperboy-ai to npm

on:
  push:
    tags:
      - "ai-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          # DO NOT set registry-url — it writes .npmrc with empty token (404s OIDC)

      - name: Install dependencies (root, all workspaces)
        run: npm ci

      - name: Build
        working-directory: paperboy-ai
        run: npm run build

      - name: Run tests
        working-directory: paperboy-ai
        run: npm test

      - name: Publish to npm (OIDC trusted publishing, no token needed)
        working-directory: paperboy-ai
        run: |
          node ../scripts/pin-registry-deps.mjs ai
          npm publish --access public
